name: Artifact repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: git archive HEAD | docker build -f Dockerfile.check -
